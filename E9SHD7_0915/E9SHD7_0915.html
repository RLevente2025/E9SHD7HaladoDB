<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SQL utasitascsoportok</title>
</head>
<body>
<h1>Az SQL nyelv utasításcsoportjai</h1>

<h2>DDL - adatdefiníciós nyelv</h2>
<p>CREATE, ALTER, DROP, TRUNCATE, RENAME</p>

<h2>DML - adatmanipulációs nyelv</h2>
<p>INSERT, UPDATE, DELETE, MERGE</p>

<h2>DQL - lekérdező nyelv</h2>
<p>SELECT</p>

<h2>DCL - adatvezérlő nyelv</h2>
<p>GRANT, REVOKE</p>

<h2>TCL - tranzakcióvezérlő nyelv</h2>
<p>COMMIT, ROLLBACK, SAVEPOINT</p>
</body>
</html>
